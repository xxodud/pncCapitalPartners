<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 96" fill="none">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&amp;family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&amp;display=swap');
    .pnc-monogram {
      font-family: 'Cormorant Garamond', 'Cinzel', 'Times New Roman', Georgia, serif;
      font-weight: 700;
    }
    .pnc-sub {
      font-family: 'Cinzel', 'Cormorant Garamond', 'Times New Roman', serif;
      font-weight: 600;
      letter-spacing: 0.24em;
    }
  </style>
  <!-- P&C Monogram matching the architectural signage -->
  <g transform="translate(8, 2)">
    <!-- Letter P -->
    <text x="12" y="54" class="pnc-monogram" font-size="60" fill="#FFFFFF">P</text>
    <!-- Interlocking Ampersand & -->
    <text x="35" y="61" class="pnc-monogram" font-size="38" fill="#FFB932">&amp;</text>
    <!-- Letter C -->
    <text x="58" y="62" class="pnc-monogram" font-size="56" fill="#FFFFFF">C</text>
    <!-- Divider accent line -->
    <line x1="112" y1="18" x2="112" y2="62" stroke="rgba(255,255,255,0.28)" stroke-width="1"/>
    <!-- Brand Text Right Side for horizontal header balance + stacked subtitle -->
    <text x="126" y="38" class="pnc-sub" font-size="15" fill="#FFFFFF">P&amp;C CAPITAL</text>
    <text x="126" y="56" class="pnc-sub" font-size="11.5" fill="#FFB932" letter-spacing="0.32em">PARTNERS</text>
  </g>
</svg>
